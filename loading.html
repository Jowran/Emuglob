<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file: https: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  :root { --c:#7c6cf0; }
  html, body { margin:0; height:100%; background:#000; overflow:hidden; font-family:'Segoe UI', system-ui, sans-serif; color:#e5e7eb; user-select:none; cursor:default; }
  body { display:flex; align-items:center; justify-content:center; transition:opacity .25s; }
  body.out { opacity:0; }
  .box { display:flex; flex-direction:column; align-items:center; gap:22px; max-width:80vw; }
  .t { font-size:20px; font-weight:600; text-align:center; }
  .s { font-size:13px; color:#9ca3af; margin-top:-12px; }

  /* console stylisée (générique, assortie à la cartouche) : le support (cartouche / disque) descend dans la fente */
  .stage { position:relative; width:280px; height:260px; }
  .con { position:absolute; left:50%; bottom:0; width:var(--cw,260px); height:var(--ch,104px); margin-left:calc(var(--cw,260px) / -2); border-radius:var(--cr,18px); z-index:2;
    background:var(--cb, linear-gradient(180deg, #2a2d36, #16181e)); box-shadow:0 18px 50px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.08); }
  .stripe { position:absolute; left:18px; right:18px; bottom:22px; height:4px; border-radius:2px; background:var(--c); opacity:.55; }
  .slot { position:absolute; left:50%; top:-5px; width:136px; height:10px; transform:translateX(-50%); border-radius:5px; background:#050608; box-shadow:inset 0 2px 4px #000, 0 1px 0 rgba(255,255,255,.06); }
  .led { position:absolute; right:22px; top:30px; width:8px; height:8px; border-radius:50%; background:#3a3d46; transition:background .3s, box-shadow .3s; }
  .on .led { background:var(--c); box-shadow:0 0 10px var(--c), 0 0 22px var(--c); animation:pulse 1.6s ease-in-out .2s infinite; }
  .btn { position:absolute; left:22px; top:26px; width:26px; height:14px; border-radius:7px; background:#0d0e12; box-shadow:inset 0 1px 2px #000; }
  .scr, .dp, .ab, .side { display:none; position:absolute; }
  /* écran des portables : s'allume avec la jaquette quand le jeu est inséré */
  .scr { background:#0b0c10 center/cover no-repeat; border-radius:6px; box-shadow:0 0 0 6px #0f1116, inset 0 0 0 1px rgba(255,255,255,.05); transition:background-color .4s, filter .4s; filter:brightness(.25); }
  .on .scr { background-color:var(--c); filter:none; }
  .dp { width:30px; height:30px; background:linear-gradient(#0d0e12,#0d0e12) center/10px 30px no-repeat, linear-gradient(#0d0e12,#0d0e12) center/30px 10px no-repeat; }
  .ab { width:34px; height:24px; background:radial-gradient(circle at 25% 65%, #0d0e12 6px, transparent 7px), radial-gradient(circle at 75% 35%, #0d0e12 6px, transparent 7px); }
  .side { top:0; bottom:0; width:17%; background:var(--c); opacity:.85; }
  .side.l { left:0; border-radius:var(--cr) 0 0 var(--cr); } .side.r { right:0; border-radius:0 var(--cr) var(--cr) 0; filter:brightness(.8); }
  .hv .scr, .hv .dp, .hv .ab, .hh .scr, .hh .dp, .hh .ab, .hs .scr, .hs .side { display:block; }
  .hv .btn, .hh .btn, .hs .btn, .hv .stripe, .hh .stripe, .hs .stripe { display:none; }
  .hv .scr { left:16%; right:16%; top:12%; height:42%; }   .hv .dp { left:16%; bottom:14%; }   .hv .ab { right:14%; bottom:18%; }   .hv .led { left:9%; right:auto; top:28%; width:6px; height:6px; }
  .hh .scr { left:30%; right:30%; top:18%; bottom:18%; }   .hh .dp { left:9%; top:50%; margin-top:-15px; }   .hh .ab { right:8%; top:50%; margin-top:-12px; }   .hh .led { left:24%; right:auto; top:22%; width:6px; height:6px; }
  .hs .scr { left:21%; right:21%; top:12%; bottom:12%; box-shadow:none; border-radius:3px; }   .hs .led { left:50%; right:auto; top:auto; bottom:3px; width:5px; height:5px; margin-left:-2px; }
  .md .btn { left:50%; top:22px; margin-left:-24px; width:48px; height:48px; border-radius:50%; background:radial-gradient(circle, #16181e 45%, #0d0e12 46%, #0d0e12 60%, transparent 61%); box-shadow:none; }
  .atari .stripe { left:0; right:0; bottom:0; height:38%; border-radius:0 0 var(--cr) var(--cr); opacity:1; background:repeating-linear-gradient(90deg, #6b4423 0 7px, #7a4f2a 7px 13px, #5e3b1e 13px 18px); }
  .snes .btn { width:16px; height:16px; border-radius:50%; } .snes .btn + .btn { left:46px; }

  /* le support est coupé au niveau de la fente : il ne dépasse jamais sous la console */
  .clip { position:absolute; left:-40px; right:-40px; top:-100px; bottom:var(--clipb,100px); overflow:hidden; z-index:1; }
  .media { position:absolute; margin-top:100px; left:50%; top:0; z-index:1; animation:insert 1.25s cubic-bezier(.55,0,.25,1) .25s both; }
  .cart { width:var(--w,118px); height:var(--h,132px); margin-left:calc(var(--w,118px) / -2); border-radius:var(--r,10px 10px 4px 4px); background:linear-gradient(180deg, #3b3f4a, #23262e);
    box-shadow:0 8px 24px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.1); }
  .cart::before { content:''; position:absolute; left:10%; right:10%; top:7%; height:6px; border-radius:3px; background:repeating-linear-gradient(90deg, #1a1c22 0 6px, transparent 6px 10px); }
  .cart .lbl { position:absolute; left:10%; right:10%; top:var(--lt,18%); bottom:var(--lb,20%); border-radius:4px; background:var(--c) center/cover no-repeat; box-shadow:inset 0 0 0 1px rgba(255,255,255,.12); }
  .disc { width:126px; height:126px; margin-left:-63px; border-radius:50%;
    background:conic-gradient(from 30deg, #cfd3dc, #8f96a6, #e9ecf2, #9aa1b0, #d6dae2, #8f96a6, #cfd3dc); box-shadow:0 8px 24px rgba(0,0,0,.6); }
  .disc .lbl { position:absolute; inset:14px; border-radius:50%; background:var(--c) center/cover no-repeat; }
  .disc::after { content:''; position:absolute; left:50%; top:50%; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%; background:#000; box-shadow:0 0 0 5px rgba(255,255,255,.35); z-index:1; }
  .disc .lbl { animation:spin 1.1s linear infinite; }

  @keyframes insert { 0% { transform:translateY(-30px); opacity:0; } 18% { opacity:1; } 55% { transform:translateY(-4px); } 100% { transform:translateY(var(--end,96px)); } }
  .media.disc { animation-name:insertd; }
  @keyframes insertd { 0% { transform:translateY(-40px); opacity:0; } 18% { opacity:1; } 55% { transform:translateY(-6px); } 100% { transform:translateY(var(--end,150px)); } }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes pulse { 50% { opacity:.45; } }

  .bar { width:180px; height:3px; border-radius:2px; background:#1f2937; overflow:hidden; }
  .bar i { display:block; width:40%; height:100%; background:var(--c); border-radius:2px; animation:mv 1.1s ease-in-out infinite; }
  @keyframes mv { 0% { transform:translateX(-100%); } 100% { transform:translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .media { animation:none; transform:translateY(var(--end,96px)); } .disc .lbl, .bar i, .on .led { animation:none; } }
</style></head>
<body><div class="box">
  <div class="stage" id="stage">
    <div class="clip"><div class="media" id="media"><div class="lbl" id="lbl"></div></div></div>
    <div class="con" id="con"><div class="side l"></div><div class="side r"></div><div class="stripe"></div><div class="scr" id="scr"></div><div class="dp"></div><div class="ab"></div><div class="slot"></div><div class="btn"></div><div class="led"></div></div>
  </div>
  <div class="t" id="t"></div>
  <div class="bar"><i></i></div>
  <div class="s" id="s">Chargement…</div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('t').textContent = q.get('t') || '';
  if (q.get('e')) document.getElementById('s').textContent = 'Chargement de ' + q.get('e') + '…';
  const c = q.get('c');
  if (c && CSS.supports('color', c)) document.documentElement.style.setProperty('--c', c);
  const media = document.getElementById('media');
  const disc = q.get('k') === 'disc';
  media.classList.add(disc ? 'disc' : 'cart');
  // forme de la cartouche selon la famille de console (proportions stylisées) : largeur, hauteur, coins, étiquette (haut / bas)
  const FORMS = {
    gb:    [104, 116, '6px 6px 4px 20px', '20%', '22%'],
    gba:   [124, 78,  '8px 8px 4px 4px', '24%', '16%'],
    nes:   [132, 150, '4px', '14%', '30%'],
    snes:  [150, 112, '20px 20px 6px 6px', '20%', '22%'],
    n64:   [140, 118, '24px 24px 6px 6px', '22%', '18%'],
    md:    [128, 118, '8px 8px 4px 4px', '20%', '24%'],
    card:  [76,  86,  '6px 16px 4px 4px', '22%', '14%'],
    mini:  [58,  70,  '6px 12px 4px 4px', '22%', '14%'],
    atari: [112, 96,  '6px 6px 4px 4px', '24%', '20%'],
    tile:  [92,  70,  '6px', '20%', '16%'],
  };
  // console assortie : [largeur, hauteur, coins, type, fond] ; type hv = portable vertical, hh = portable horizontal, hs = tablette, sinon salon
  const LIGHT = 'linear-gradient(180deg, #c9ccd2, #9da1a9)', GREY = 'linear-gradient(180deg, #b7bac1, #8c9099)';
  const CONS = {
    gb:    [150, 176, '12px 12px 40px 12px', 'hv', GREY],
    gba:   [250, 112, '34px', 'hh'],
    card:  [196, 150, '16px', 'hv'],
    mini:  [258, 108, '18px', 'hs'],
    tile:  [236, 112, '46px', 'hh'],
    nes:   [250, 90,  '6px',  'nes', LIGHT],
    snes:  [250, 96,  '34px 34px 14px 14px', 'snes', LIGHT],
    n64:   [260, 100, '48px 48px 16px 16px', 'n64'],
    md:    [250, 92,  '16px', 'md'],
    atari: [250, 90,  '8px',  'atari'],
  };
  const fk = disc ? '' : q.get('f');
  const f = disc ? null : (FORMS[fk] || [118, 132, '10px 10px 4px 4px', '18%', '20%']);
  const k = CONS[fk] || [260, 104, '18px', ''];
  const con = document.getElementById('con'), cs = con.style;
  cs.setProperty('--cw', k[0] + 'px'); cs.setProperty('--ch', k[1] + 'px'); cs.setProperty('--cr', k[2]);
  if (k[3]) con.classList.add(k[3]);
  if (k[4]) cs.setProperty('--cb', k[4]);
  if (k[3] === 'snes') con.insertAdjacentHTML('beforeend', '<div class="btn"></div>');
  const h = disc ? 126 : f[1];
  if (f) { const st = media.style; st.setProperty('--w', f[0] + 'px'); st.setProperty('--h', f[1] + 'px'); st.setProperty('--r', f[2]); st.setProperty('--lt', f[3]); st.setProperty('--lb', f[4]); }
  const stH = 260, conTop = stH - k[1];
  document.getElementById('stage').style.setProperty('--clipb', (k[1] - 3) + 'px');
  media.style.top = (conTop - 8 - h) + 'px';                            // posé juste au-dessus de la fente
  media.style.setProperty('--end', (disc ? h + 8 : h - 30) + 'px');     // disque : entièrement rentré ; cartouche : dépasse un peu
  document.getElementById('stage').style.marginTop = Math.max(0, h + 30 - conTop) + 'px';
  document.querySelector('.slot').style.width = Math.min(k[0] - 30, (disc ? 136 : f[0] + 18)) + 'px';
  const img = q.get('img');
  if (img) { const im = new Image(); im.onload = () => { const u = 'url("' + img.replace(/"/g, '%22') + '")'; document.getElementById('lbl').style.backgroundImage = u; document.getElementById('scr').style.backgroundImage = u; }; im.src = img; }
  media.addEventListener('animationend', (e) => { if (/^insert/.test(e.animationName)) document.getElementById('stage').classList.add('on'); });
</script>
</body></html>
